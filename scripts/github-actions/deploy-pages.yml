name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Check website assets and JavaScript
        run: |
          python3 scripts/check_site.py
          node --check dist/script.js
          node --check dist/field-lab.js
          node scripts/check_field_math.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare website and publication URLs
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/prepare_pages.py --base-url "$PAGES_BASE_URL"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
